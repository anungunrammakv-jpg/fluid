<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#05070f" />
  <title>Fluid - WebGL Animation</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <button id="settingsToggle" class="settings-toggle" type="button" aria-label="Toggle settings">⚙️</button>
  <aside id="settingsPanel" class="glass-panel collapsed">
    <div class="glass-header">
      <div class="glass-title">Fluid Controls</div>
      <button id="closeSettings" class="close-btn" type="button" aria-label="Close settings">✕</button>
    </div>
    <div id="controls" class="controls-container"></div>
  </aside>
  <canvas id="fluid" role="img" aria-label="Fluid animation canvas"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
