<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebGL Fluid Animation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --glass-bg: rgba(18, 24, 38, 0.42);
      --glass-border: rgba(255, 255, 255, 0.28);
      --text: #f5f8ff;
      --muted: rgba(245, 248, 255, 0.72);
      --accent: #87d3ff;
    }
    body {
      background: radial-gradient(circle at 20% 15%, #1a2134, #05070f 58%);
      width: 100vw;
      height: 200vh;
      overflow-x: hidden;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    }
    canvas {
      width: 100vw;
      height: 200vh;
      display: block;
    }
    .settings-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 130;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--text);
      background: linear-gradient(145deg, rgba(151, 220, 255, 0.24), rgba(113, 130, 255, 0.12));
      border-radius: 12px;
      padding: 0.58rem 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .glass-panel {
      position: fixed;
      top: 4rem;
      right: 1rem;
      width: min(340px, calc(100vw - 2rem));
      max-height: calc(100vh - 2rem);
      overflow: auto;
      padding: 1rem;
      border-radius: 20px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px) saturate(130%);
      -webkit-backdrop-filter: blur(16px) saturate(130%);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      color: var(--text);
      z-index: 120;
    }
    .glass-panel.collapsed {
      display: none;
    }
    .glass-title {
      margin-bottom: 0.8rem;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--muted);
    }
    .glass-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 0.62rem;
      font-size: 0.86rem;
      color: var(--muted);
    }
    .glass-row input[type="range"] {
      width: 145px;
      accent-color: var(--accent);
    }
    .glass-row select {
      width: 145px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 0.33rem 0.45rem;
    }
    .glass-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }
    .glass-btn {
      width: 100%;
      margin-top: 0.2rem;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--text);
      background: linear-gradient(145deg, rgba(151, 220, 255, 0.24), rgba(113, 130, 255, 0.12));
      border-radius: 12px;
      padding: 0.58rem 0.65rem;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease;
    }
    .glass-btn:hover {
      transform: translateY(-1px);
      background: linear-gradient(145deg, rgba(151, 220, 255, 0.3), rgba(113, 130, 255, 0.2));
    }
    @media (max-width: 700px) {
      .settings-toggle { top: auto; bottom: 0.7rem; right: 0.7rem; }
      .glass-panel { top: auto; bottom: 3.6rem; right: 0.7rem; }
    }
  </style>
