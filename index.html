<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#05070f" />
  <title>Fluid - WebGL Animation</title>
  <style>
    /* Root Variables */
    :root {
      --glass-bg: rgba(18, 24, 38, 0.42);
      --glass-border: rgba(255, 255, 255, 0.28);
      --text: #f5f8ff;
      --muted: rgba(245, 248, 255, 0.72);
      --accent: #87d3ff;
      --accent-hover: #b3e5fc;
      --safe-top: max(0px, env(safe-area-inset-top));
      --safe-bottom: max(0px, env(safe-area-inset-bottom));
      --safe-left: max(0px, env(safe-area-inset-left));
      --safe-right: max(0px, env(safe-area-inset-right));
    }

    /* Global Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: radial-gradient(circle at 20% 15%, #1a2134, #05070f 58%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--text);
      position: fixed;
    }

    /* Canvas */
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Settings Toggle Button */
    .settings-toggle {
      position: fixed;
      top: calc(var(--safe-top) + 1rem);
      right: calc(var(--safe-right) + 1rem);
      z-index: 130;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--text);
      background: linear-gradient(145deg, rgba(151, 220, 255, 0.24), rgba(113, 130, 255, 0.12));
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .settings-toggle:active {
      transform: scale(0.95);
      background: linear-gradient(145deg, rgba(151, 220, 255, 0.3), rgba(113, 130, 255, 0.2));
    }

    @media (max-width: 768px) {
      .settings-toggle {
        bottom: calc(var(--safe-bottom) + 1rem);
        top: auto;
        right: calc(var(--safe-right) + 1rem);
      }
    }

    /* Glass Panel */
    .glass-panel {
      position: fixed;
      top: calc(var(--safe-top) + 5rem);
      right: calc(var(--safe-right) + 1rem);
      z-index: 120;
      width: min(340px, calc(100vw - 2rem - var(--safe-left) - var(--safe-right)));
      max-height: calc(100vh - 7rem - var(--safe-top) - var(--safe-bottom));
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.2rem;
      border-radius: 20px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px) saturate(130%);
      -webkit-backdrop-filter: blur(16px) saturate(130%);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      color: var(--text);
      animation: slideIn 0.3s ease;
    }

    .glass-panel.collapsed {
      display: none;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Glass Panel Header */
    .glass-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-title {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--muted);
      font-weight: 600;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.25rem;
      transition: color 0.2s ease;
    }

    .close-btn:active {
      color: var(--accent);
    }

    /* Controls Container */
    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    /* Glass Row */
    .glass-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      align-items: center;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .glass-row label {
      font-size: 0.85rem;
      font-weight: 500;
    }

    .glass-row input[type="range"] {
      width: 120px;
      height: 5px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .glass-row input[type="range"]:active {
      accent-color: var(--accent-hover);
    }

    /* Range Value Display */
    .range-value {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 600;
      min-width: 45px;
      text-align: right;
    }

    /* Glass Button */
    .glass-btn {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--text);
      background: linear-gradient(145deg, rgba(151, 220, 255, 0.24), rgba(113, 130, 255, 0.12));
      border-radius: 12px;
      padding: 0.65rem 0.75rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      margin-top: 0.5rem;
    }

    .glass-btn:active {
      transform: translateY(-1px);
      background: linear-gradient(145deg, rgba(151, 220, 255, 0.3), rgba(113, 130, 255, 0.2));
      box-shadow: 0 4px 12px rgba(135, 211, 255, 0.2);
    }

    /* Mobile Optimizations */
    @media (max-width: 768px) {
      .glass-panel {
        top: auto;
        bottom: calc(var(--safe-bottom) + 5rem);
        right: calc(var(--safe-right) + 1rem);
        width: min(300px, calc(100vw - 2rem - var(--safe-left) - var(--safe-right)));
        max-height: calc(60vh - var(--safe-bottom));
        padding: 1rem;
      }

      .glass-row {
        gap: 0.5rem;
      }

      .glass-row input[type="range"] {
        width: 100px;
      }

      .range-value {
        min-width: 40px;
      }

      .glass-title {
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      .settings-toggle {
        width: 40px;
        height: 40px;
        font-size: 1rem;
        top: calc(var(--safe-top) + 0.8rem);
        right: calc(var(--safe-right) + 0.8rem);
      }

      .glass-panel {
        bottom: calc(var(--safe-bottom) + 4.5rem);
        right: calc(var(--safe-right) + 0.8rem);
        width: min(280px, calc(100vw - 1.6rem - var(--safe-left) - var(--safe-right)));
        padding: 0.9rem;
        max-height: calc(55vh - var(--safe-bottom));
      }

      .glass-row {
        gap: 0.4rem;
      }

      .glass-row input[type="range"] {
        width: 80px;
      }

      .glass-title {
        font-size: 0.85rem;
      }

      .glass-btn {
        padding: 0.55rem 0.65rem;
        font-size: 0.85rem;
      }

      .range-value {
        font-size: 0.75rem;
      }
    }

    /* Scrollbar Styling */
    .glass-panel::-webkit-scrollbar {
      width: 6px;
    }

    .glass-panel::-webkit-scrollbar-track {
      background: transparent;
    }

    .glass-panel::-webkit-scrollbar-thumb {
      background: rgba(135, 211, 255, 0.3);
      border-radius: 3px;
    }

    .glass-panel::-webkit-scrollbar-thumb:hover {
      background: rgba(135, 211, 255, 0.5);
    }
  </style>
</head>
<body>
  <button id="settingsToggle" class="settings-toggle" type="button" aria-label="Toggle settings">⚙️</button>
  <aside id="settingsPanel" class="glass-panel collapsed">
    <div class="glass-header">
      <div class="glass-title">Fluid Controls</div>
      <button id="closeSettings" class="close-btn" type="button" aria-label="Close settings">✕</button>
    </div>
    <div id="controls" class="controls-container"></div>
  </aside>
  <canvas id="fluid" role="img" aria-label="Fluid animation canvas"></canvas>

  <script>
    /**
     * Fluid Simulation - All-in-One HTML File
     * WebGL2-based 2D incompressible fluid simulator
     * Open in any modern browser and enjoy!
     */

    // ==================== CONFIGURATION ====================
    const CONFIG = {
      webgl: {
        antialias: false,
        alpha: true,
        preserveDrawingBuffer: false,
        powerPreference: 'low-power',
      },
      simulation: {
        diffusion: 0.0001,
        viscosity: 0.0001,
        forceScale: 100,
        decayAmount: 0.992,
        iterations: 16,
      },
      render: {
        velocityScale: 1.5,
        densityScale: 1.2,
      },
      colors: {
        background: [0.05, 0.027, 0.059, 1.0],
        fluid: [0.53, 0.83, 1.0, 0.8],
        accent: [0.8, 0.95, 1.0, 1.0],
      },
      touch: {
        radiusScale: 2.0,
        forceScale: 0.5,
      },
    };

    // ==================== SHADERS ====================
    const VERTEX_SHADER = `#version 300 es
precision highp float;

in vec2 position;
in vec2 uv;

out vec2 vUv;

void main() {
  vUv = uv;
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

    const DISPLAY_SHADER = `#version 300 es
precision highp float;

uniform sampler2D u_velocity;
uniform sampler2D u_density;
uniform float u_velocityScale;
uniform float u_densityScale;

in vec2 vUv;
out vec4 outColor;

void main() {
  vec2 vel = texture(u_velocity, vUv).xy;
  vec4 den = texture(u_density, vUv);
  
  float speed = length(vel) * u_velocityScale;
  float angle = atan(vel.y, vel.x);
  
  // Create colorful effect based on velocity direction
  vec3 color = vec3(
    0.5 + 0.5 * sin(angle + 0.0),
    0.5 + 0.5 * sin(angle + 2.094),
    0.5 + 0.5 * sin(angle + 4.189)
  );
  
  // Blend with density for more visible result
  vec3 baseColor = vec3(0.53, 0.83, 1.0);
  color = mix(color * 0.7, baseColor, den.x * u_densityScale);
  
  outColor = vec4(color, 1.0);
}
`;

    // ==================== WEBGL UTILITIES ====================
    class WebGLHelper {
      static createContext(canvas, config) {
        const gl = canvas.getContext('webgl2', config) || canvas.getContext('webgl', config);
        if (!gl) throw new Error('WebGL not supported');
        return gl;
      }

      static compileShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);

        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error('Shader error:', gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      }

      static createProgram(gl, vertexSource, fragmentSource) {
        const program = gl.createProgram();
        const vs = this.compileShader(gl, gl.VERTEX_SHADER, vertexSource);
        const fs = this.compileShader(gl, gl.FRAGMENT_SHADER, fragmentSource);

        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          console.error('Program error:', gl.getProgramInfoLog(program));
          gl.deleteProgram(program);
          return null;
        }

        gl.deleteShader(vs);
        gl.deleteShader(fs);
        return program;
      }

      static createTexture(gl, width, height, data = null) {
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, width, height, 0, gl.RGBA, gl.FLOAT, data);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return texture;
      }

      static setUniformTexture(gl, program, name, unit, texture) {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        const loc = gl.getUniformLocation(program, name);
        if (loc !== null) gl.uniform1i(loc, unit);
      }

      static setUniformFloat(gl, program, name, value) {
        const loc = gl.getUniformLocation(program, name);
        if (loc !== null) gl.uniform1f(loc, value);
      }
    }

    // ==================== FLUID SIMULATOR ====================
    class FluidSimulator {
      constructor(canvas) {
        this.canvas = canvas;
        this.gl = WebGLHelper.createContext(canvas, CONFIG.webgl);
        this.gl.clearColor(...CONFIG.colors.background);

        this.width = 0;
        this.height = 0;
        this.gridSize = 256;

        this.velocity = null;
        this.density = null;

        this.program = null;
        this.positionBuffer = null;
        this.uvBuffer = null;

        this.mouseX = 0;
        this.mouseY = 0;
        this.prevMouseX = 0;
        this.prevMouseY = 0;
        this.isDrawing = false;

        this.lastTime = 0;
        this.deltaTime = 0;

        this.init();
      }

      init() {
        this.setupTextures();
        this.setupShaders();
        this.setupBuffers();
        this.setupInputHandlers();
        this.resize();
      }

      setupTextures() {
        const gl = this.gl;
        this.velocity = WebGLHelper.createTexture(gl, this.gridSize, this.gridSize);
        this.density = WebGLHelper.createTexture(gl, this.gridSize, this.gridSize);
      }

      setupShaders() {
        this.program = WebGLHelper.createProgram(this.gl, VERTEX_SHADER, DISPLAY_SHADER);
      }

      setupBuffers() {
        const gl = this.gl;
        
        // Position buffer (full screen quad)
        const positions = new Float32Array([
          -1, -1,
           1, -1,
          -1,  1,
           1,  1,
        ]);
        this.positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, this.positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

        // UV buffer
        const uvs = new Float32Array([
          0, 0,
          1, 0,
          0, 1,
          1, 1,
        ]);
        this.uvBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, this.uvBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, uvs, gl.STATIC_DRAW);
      }

      setupInputHandlers() {
        this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
        this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
        this.canvas.addEventListener('mouseup', (e) => this.onMouseUp(e));
        this.canvas.addEventListener('mouseleave', (e) => this.onMouseLeave(e));

        this.canvas.addEventListener('touchstart', (e) => this.onTouchStart(e), false);
        this.canvas.addEventListener('touchmove', (e) => this.onTouchMove(e), false);
        this.canvas.addEventListener('touchend', (e) => this.onTouchEnd(e), false);

        window.addEventListener('resize', () => this.resize());
      }

      onMouseMove(e) {
        this.updateMouse(e.clientX, e.clientY);
      }

      onMouseDown(e) {
        this.isDrawing = true;
        this.updateMouse(e.clientX, e.clientY);
      }

      onMouseUp(e) {
        this.isDrawing = false;
      }

      onMouseLeave(e) {
        this.isDrawing = false;
      }

      onTouchStart(e) {
        this.isDrawing = true;
        const touch = e.touches[0];
        this.updateMouse(touch.clientX, touch.clientY);
      }

      onTouchMove(e) {
        if (!this.isDrawing) return;
        const touch = e.touches[0];
        this.updateMouse(touch.clientX, touch.clientY);
        e.preventDefault();
      }

      onTouchEnd(e) {
        this.isDrawing = false;
      }

      updateMouse(x, y) {
        this.prevMouseX = this.mouseX;
        this.prevMouseY = this.mouseY;
        this.mouseX = x;
        this.mouseY = y;
      }

      resize() {
        const dpr = window.devicePixelRatio || 1;
        const width = window.innerWidth;
        const height = window.innerHeight;

        this.canvas.width = width * dpr;
        this.canvas.height = height * dpr;

        this.canvas.style.width = width + 'px';
        this.canvas.style.height = height + 'px';

        this.gl.viewport(0, 0, this.canvas.width, this.canvas.height);

        this.width = width;
        this.height = height;
      }

      addForce() {
        if (!this.isDrawing) return;

        const dx = this.mouseX - this.prevMouseX;
        const dy = this.mouseY - this.prevMouseY;

        const normX = this.mouseX / this.width;
        const normY = 1 - this.mouseY / this.height;

        // Add velocity force
        this.addVelocity(this.velocity, dx * CONFIG.simulation.forceScale / 1000, -dy * CONFIG.simulation.forceScale / 1000, normX, normY);
        
        // Add density (dye)
        this.addDensity(this.density, 0.5, normX, normY);
      }

      addDensity(texture, amount, x, y) {
        const gl = this.gl;
        const radius = 0.08;

        // Read current texture
        const framebuffer = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);

        const data = new Float32Array(this.gridSize * this.gridSize * 4);
        gl.readPixels(0, 0, this.gridSize, this.gridSize, gl.RGBA, gl.FLOAT, data);

        // Modify data
        const gridX = Math.floor(x * this.gridSize);
        const gridY = Math.floor(y * this.gridSize);
        const radiusPixels = Math.floor(radius * this.gridSize);

        for (let i = -radiusPixels; i <= radiusPixels; i++) {
          for (let j = -radiusPixels; j <= radiusPixels; j++) {
            const px = gridX + i;
            const py = gridY + j;
            
            if (px >= 0 && px < this.gridSize && py >= 0 && py < this.gridSize) {
              const dist = Math.sqrt(i * i + j * j);
              if (dist <= radiusPixels) {
                const intensity = (1 - dist / radiusPixels) * amount;
                const idx = (py * this.gridSize + px) * 4;
                data[idx] = Math.max(data[idx], intensity);
                data[idx + 1] = Math.max(data[idx + 1], intensity);
                data[idx + 2] = Math.max(data[idx + 2], intensity);
              }
            }
          }
        }

        // Write back
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, this.gridSize, this.gridSize, 0, gl.RGBA, gl.FLOAT, data);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.deleteFramebuffer(framebuffer);
      }

      addVelocity(texture, vx, vy, x, y) {
        const gl = this.gl;
        const radius = 0.08;

        // Read current texture
        const framebuffer = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);

        const data = new Float32Array(this.gridSize * this.gridSize * 4);
        gl.readPixels(0, 0, this.gridSize, this.gridSize, gl.RGBA, gl.FLOAT, data);

        // Modify data
        const gridX = Math.floor(x * this.gridSize);
        const gridY = Math.floor(y * this.gridSize);
        const radiusPixels = Math.floor(radius * this.gridSize);

        for (let i = -radiusPixels; i <= radiusPixels; i++) {
          for (let j = -radiusPixels; j <= radiusPixels; j++) {
            const px = gridX + i;
            const py = gridY + j;
            
            if (px >= 0 && px < this.gridSize && py >= 0 && py < this.gridSize) {
              const dist = Math.sqrt(i * i + j * j);
              if (dist <= radiusPixels) {
                const falloff = 1 - dist / radiusPixels;
                const idx = (py * this.gridSize + px) * 4;
                data[idx] += vx * falloff;
                data[idx + 1] += vy * falloff;
              }
            }
          }
        }

        // Write back
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, this.gridSize, this.gridSize, 0, gl.RGBA, gl.FLOAT, data);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.deleteFramebuffer(framebuffer);
      }

      update() {
        const now = performance.now();
        this.deltaTime = (now - this.lastTime) / 1000;
        this.lastTime = now;

        this.addForce();
        this.diffuse();
        this.render();

        requestAnimationFrame(() => this.update());
      }

      diffuse() {
        const gl = this.gl;
        
        // Simple diffusion: blur density
        const framebuffer = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.density, 0);

        const data = new Float32Array(this.gridSize * this.gridSize * 4);
        gl.bindTexture(gl.TEXTURE_2D, this.density);
        gl.readPixels(0, 0, this.gridSize, this.gridSize, gl.RGBA, gl.FLOAT, data);

        // Apply gaussian blur
        for (let y = 1; y < this.gridSize - 1; y++) {
          for (let x = 1; x < this.gridSize - 1; x++) {
            const idx = (y * this.gridSize + x) * 4;
            const tl = ((y - 1) * this.gridSize + (x - 1)) * 4;
            const tc = ((y - 1) * this.gridSize + x) * 4;
            const tr = ((y - 1) * this.gridSize + (x + 1)) * 4;
            const ml = (y * this.gridSize + (x - 1)) * 4;
            const mr = (y * this.gridSize + (x + 1)) * 4;
            const bl = ((y + 1) * this.gridSize + (x - 1)) * 4;
            const bc = ((y + 1) * this.gridSize + x) * 4;
            const br = ((y + 1) * this.gridSize + (x + 1)) * 4;

            data[idx] = (data[tl] + data[tc] * 2 + data[tr] + data[ml] * 2 + data[idx] * 4 + data[mr] * 2 + data[bl] + data[bc] * 2 + data[br]) / 16;
          }
        }

        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, this.gridSize, this.gridSize, 0, gl.RGBA, gl.FLOAT, data);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.deleteFramebuffer(framebuffer);
      }

      render() {
        const gl = this.gl;

        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.useProgram(this.program);

        // Setup vertex attributes
        const posLoc = gl.getAttribLocation(this.program, 'position');
        gl.bindBuffer(gl.ARRAY_BUFFER, this.positionBuffer);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(posLoc);

        const uvLoc = gl.getAttribLocation(this.program, 'uv');
        gl.bindBuffer(gl.ARRAY_BUFFER, this.uvBuffer);
        gl.vertexAttribPointer(uvLoc, 2, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(uvLoc);

        // Set uniforms
        WebGLHelper.setUniformTexture(gl, this.program, 'u_velocity', 0, this.velocity);
        WebGLHelper.setUniformTexture(gl, this.program, 'u_density', 1, this.density);
        WebGLHelper.setUniformFloat(gl, this.program, 'u_velocityScale', CONFIG.render.velocityScale);
        WebGLHelper.setUniformFloat(gl, this.program, 'u_densityScale', CONFIG.render.densityScale);

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        // Decay density
        this.decayDensity();
      }

      decayDensity() {
        const gl = this.gl;
        const framebuffer = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.density, 0);

        const data = new Float32Array(this.gridSize * this.gridSize * 4);
        gl.readPixels(0, 0, this.gridSize, this.gridSize, gl.RGBA, gl.FLOAT, data);

        for (let i = 0; i < data.length; i++) {
          data[i] *= CONFIG.simulation.decayAmount;
        }

        gl.bindTexture(gl.TEXTURE_2D, this.density);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, this.gridSize, this.gridSize, 0, gl.RGBA, gl.FLOAT, data);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.deleteFramebuffer(framebuffer);
      }

      reset() {
        const gl = this.gl;
        const emptyData = new Float32Array(this.gridSize * this.gridSize * 4);
        
        gl.bindTexture(gl.TEXTURE_2D, this.density);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, this.gridSize, this.gridSize, 0, gl.RGBA, gl.FLOAT, emptyData);

        gl.bindTexture(gl.TEXTURE_2D, this.velocity);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, this.gridSize, this.gridSize, 0, gl.RGBA, gl.FLOAT, emptyData);
      }

      setConfig(key, value) {
        if (key in CONFIG.simulation) {
          CONFIG.simulation[key] = value;
        } else if (key in CONFIG.render) {
          CONFIG.render[key] = value;
        }
      }
    }

    // ==================== UI CONTROLS ====================
    class ControlsManager {
      constructor(container, simulator) {
        this.container = container;
        this.simulator = simulator;
        this.init();
      }

      init() {
        const controls = [
          { name: 'diffusion', label: 'Diffusion', min: 0.00001, max: 0.001, step: 0.00001, value: 0.0001 },
          { name: 'viscosity', label: 'Viscosity', min: 0.00001, max: 0.001, step: 0.00001, value: 0.0001 },
          { name: 'forceScale', label: 'Force Scale', min: 10, max: 500, step: 10, value: 100 },
          { name: 'decayAmount', label: 'Decay', min: 0.9, max: 0.999, step: 0.001, value: 0.992 },
          { name: 'velocityScale', label: 'Velocity', min: 0.5, max: 3, step: 0.1, value: 1.5 },
          { name: 'densityScale', label: 'Density', min: 0.5, max: 3, step: 0.1, value: 1.2 },
        ];

        controls.forEach(ctrl => {
          const row = document.createElement('div');
          row.className = 'glass-row';

          const label = document.createElement('label');
          label.textContent = ctrl.label;

          const input = document.createElement('input');
          input.type = 'range';
          input.min = ctrl.min;
          input.max = ctrl.max;
          input.step = ctrl.step;
          input.value = ctrl.value;

          const value = document.createElement('span');
          value.className = 'range-value';
          value.textContent = ctrl.value.toFixed(3);

          input.addEventListener('input', (e) => {
            const newValue = parseFloat(e.target.value);
            value.textContent = newValue.toFixed(3);
            this.simulator.setConfig(ctrl.name, newValue);
          });

          row.appendChild(label);
          row.appendChild(input);
          row.appendChild(value);
          this.container.appendChild(row);
        });

        // Reset button
        const resetBtn = document.createElement('button');
        resetBtn.className = 'glass-btn';
        resetBtn.textContent = 'Reset Fluid';
        resetBtn.addEventListener('click', () => this.simulator.reset());
        this.container.appendChild(resetBtn);
      }
    }

    // ==================== APP INITIALIZATION ====================
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('fluid');
      const settingsToggle = document.getElementById('settingsToggle');
      const settingsPanel = document.getElementById('settingsPanel');
      const closeSettings = document.getElementById('closeSettings');
      const controlsContainer = document.getElementById('controls');

      try {
        const simulator = new FluidSimulator(canvas);
        new ControlsManager(controlsContainer, simulator);

        settingsToggle.addEventListener('click', () => {
          settingsPanel.classList.toggle('collapsed');
        });

        closeSettings.addEventListener('click', () => {
          settingsPanel.classList.add('collapsed');
        });

        document.addEventListener('click', (e) => {
          if (!settingsPanel.contains(e.target) && !settingsToggle.contains(e.target)) {
            settingsPanel.classList.add('collapsed');
          }
        });

        simulator.update();
      } catch (error) {
        console.error('Error initializing Fluid simulator:', error);
        alert('Error: WebGL not supported on this device');
      }
    });
  </script>
</body>
</html>
